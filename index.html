<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Flashcards CAPES Mathématiques</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Parser CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <!-- KaTeX pour le rendu LaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <h1>Flashcards CAPES <span class="subtitle">Mathématiques</span></h1>
    </header>

    <!-- Écran de chargement -->
    <div id="loading" class="status-msg">
      <div class="spinner"></div>
      <p>Chargement des flashcards...</p>
    </div>

    <!-- Application principale -->
    <main id="flashcardApp" class="hidden">

      <!-- Boîtes Leitner -->
      <div class="boxes-bar">
        <button class="box-tab box-1 active" id="box-tab-1" onclick="selectBox(1)">
          <span class="box-name">Boîte 1</span>
          <span class="box-count" id="box-count-1">0</span>
        </button>
        <button class="box-tab box-2" id="box-tab-2" onclick="selectBox(2)">
          <span class="box-name">Boîte 2</span>
          <span class="box-count" id="box-count-2">0</span>
        </button>
        <button class="box-tab box-3" id="box-tab-3" onclick="selectBox(3)">
          <span class="box-name">Boîte 3</span>
          <span class="box-count" id="box-count-3">0</span>
        </button>
      </div>

      <!-- Filtre + actions -->
      <div class="controls-bar">
        <select id="themeFilter" class="filter-select" onchange="onThemeChange()" aria-label="Filtrer par thème">
          <option value="ALL">Tous les thèmes</option>
          <option value="Dénombrements, proba, stats">Dénombrements, proba, stats</option>
          <option value="Arithmétique">Arithmétique</option>
          <option value="Nombres complexes">Nombres complexes</option>
          <option value="Géométrie">Géométrie</option>
          <option value="Proportionnalité et pourcentages">Proportionnalité & pourcentages</option>
          <option value="Équations">Équations</option>
          <option value="Graphes et matrices">Graphes & matrices</option>
          <option value="Analyse">Analyse</option>
          <option value="Méthodologie & Modélisation">Méthodologie & Modélisation</option>
        </select>

        <button id="shuffleBtn" class="icon-btn" onclick="shuffleDeck()" title="Mélanger le paquet" aria-label="Mélanger le paquet">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="m4 4 5 5"/></svg>
        </button>

        <button id="resetSrsBtn" class="icon-btn icon-danger" title="Remettre toutes les cartes en Boîte 1" aria-label="Réinitialiser les boîtes">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
      </div>

      <div class="deck-bar">
        <span id="counter" class="counter-badge">Carte 0 / 0</span>
      </div>

      <div class="card-deck">
        <article class="flashcard">
          <div class="card-top">
            <span class="badge-lesson" id="cardLesson">Leçon --</span>
            <span class="badge-theme" id="cardTheme">Thème --</span>
          </div>

          <div class="card-content">
            <div class="question-section">
              <span class="section-label">Question</span>
              <div class="question-text" id="cardQuestion">Chargement...</div>
            </div>

            <div id="answerSection" class="answer-section hidden">
              <hr class="divider">
              <span class="section-label">Réponse</span>
              <div class="answer-text" id="cardResponse"></div>

              <div id="cardVideoContainer" class="video-box hidden">
                <a id="cardVideo" href="#" target="_blank" rel="noopener noreferrer" class="video-btn">
                  ▶ Voir la vidéo explicative
                </a>
              </div>
            </div>
          </div>

          <div id="revealContainer" class="reveal-container">
            <button id="revealBtn" class="btn-reveal">Afficher la réponse</button>
          </div>
        </article>
      </div>

      <!-- Évaluation Leitner -->
      <div id="srsPanel" class="srs-container hidden">
        <div class="srs-actions">
          <button id="btnAgain" class="srs-btn btn-again">
            <span class="srs-title">À revoir</span>
            <span class="srs-time">Retour boîte 1</span>
          </button>
          <button id="btnHard" class="srs-btn btn-hard">
            <span class="srs-title">Difficile</span>
            <span class="srs-time">Reste ici</span>
          </button>
          <button id="btnEasy" class="srs-btn btn-easy">
            <span class="srs-title">Facile</span>
            <span class="srs-time">Boîte suivante</span>
          </button>
        </div>
      </div>
    </main>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
