<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Flashcards CAPES Mathématiques</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <span class="logo-icon">📐</span>
        <h1>Flashcards CAPES</h1>
      </div>
    </header>

    <!-- Écran de chargement -->
    <div id="loading" class="status-msg">
      <div class="spinner"></div>
      <p>Analyse de la file de révision...</p>
    </div>

    <!-- Écran de fin de session (Si 0 carte due) -->
    <div id="sessionDone" class="status-msg hidden">
      <div class="done-icon">🎉</div>
      <h2>Session terminée !</h2>
      <p>Tu n'as plus aucune carte à réviser pour aujourd'hui. Reviens demain !</p>
      <button id="resetSrsBtn" class="action-btn text-danger margin-top">🔄 Réinitialiser l'historique SRS</button>
    </div>

    <!-- Application principale (Session de révision) -->
    <main id="flashcardApp" class="hidden">
      <div class="deck-bar">
        <div class="deck-info">
          <span id="counter" class="counter-badge">Reste à réviser : --</span>
        </div>
      </div>

      <div class="card-deck">
        <article class="flashcard">
          <div class="card-top">
            <span class="badge-lesson" id="cardLesson">Leçon --</span>
          </div>

          <div class="card-content">
            <div class="question-section">
              <span class="section-label">QUESTION</span>
              <div class="question-text" id="cardQuestion">Chargement...</div>
            </div>

            <div id="answerSection" class="answer-section hidden">
              <hr class="divider">
              <span class="section-label">RÉPONSE / DÉMONSTRATION</span>
              <div class="answer-text" id="cardResponse"></div>
              
              <div id="cardVideoContainer" class="video-box hidden">
                <a id="cardVideo" href="#" target="_blank" rel="noopener noreferrer" class="video-btn">
                  ▶ Voir la vidéo explicative
                </a>
              </div>
            </div>
          </div>

          <div id="revealContainer" class="reveal-container">
            <button id="revealBtn" class="btn-reveal">Afficher la réponse (Espace)</button>
          </div>
        </article>
      </div>

      <!-- Module d'évaluation SRS -->
      <div id="srsPanel" class="srs-container hidden">
        <p class="srs-instruction">Comment as-tu retenu cette carte ?</p>
        <div class="srs-actions">
          <button id="btnAgain" class="srs-btn btn-again">
            <span class="srs-emoji">🔴</span>
            <span class="srs-title">À revoir</span>
            <span class="srs-time">Reste aujourd'hui</span>
          </button>
          <button id="btnHard" class="srs-btn btn-hard">
            <span class="srs-emoji">🟠</span>
            <span class="srs-title">Difficile</span>
            <span class="srs-time">Demain</span>
          </button>
          <button id="btnEasy" class="srs-btn btn-easy">
            <span class="srs-emoji">🟢</span>
            <span class="srs-title">Facile</span>
            <span class="srs-time" id="easyIntervalText">+3 jours</span>
          </button>
        </div>
      </div>
    </main>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
