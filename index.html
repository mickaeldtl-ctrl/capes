<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Flashcards CAPES Mathématiques</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <!-- Bibliothèque PapaParse pour lire le CSV Google Sheets -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <span class="logo-icon">📐</span>
        <h1>Flashcards CAPES</h1>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Rechercher une leçon, une question...">
      </div>
    </header>

    <!-- Écran de chargement / d'erreur -->
    <div id="loading" class="status-msg">
      <div class="spinner"></div>
      <p id="loadingText">Chargement de vos cartes en cours...</p>
    </div>

    <!-- Conteneur principal de l'application -->
    <main id="flashcardApp" class="hidden">
      <div class="deck-bar">
        <div class="deck-info">
          <span id="counter" class="counter-badge">Carte 0 / 0</span>
          <span id="dueBadge" class="due-badge hidden">⚠️ À réviser</span>
        </div>
        <div class="deck-actions">
          <button id="randomBtn" class="action-btn" title="Carte aléatoire">🎲 Aléatoire</button>
          <button id="resetSrsBtn" class="action-btn text-danger" title="Réinitialiser le suivi SRS">🔄 RàZ</button>
        </div>
      </div>

      <div class="card-deck">
        <article class="flashcard">
          <div class="card-top">
            <span class="badge-lesson" id="cardLesson">Leçon --</span>
          </div>

          <div class="card-content">
            <div class="question-section">
              <span class="section-label">QUESTION</span>
              <div class="question-text" id="cardQuestion">Chargement...</div>
            </div>

            <div id="answerSection" class="answer-section hidden">
              <hr class="divider">
              <span class="section-label">RÉPONSE / DÉMONSTRATION</span>
              <div class="answer-text" id="cardResponse"></div>
              
              <div id="cardVideoContainer" class="video-box hidden">
                <a id="cardVideo" href="#" target="_blank" rel="noopener noreferrer" class="video-btn">
                  ▶ Voir la vidéo explicative
                </a>
              </div>
            </div>
          </div>

          <div id="revealContainer" class="reveal-container">
            <button id="revealBtn" class="btn-reveal">Afficher la réponse (Espace)</button>
          </div>
        </article>
      </div>

      <!-- Module de répétition espacée (SRS) -->
      <div id="srsPanel" class="srs-container hidden">
        <p class="srs-instruction">Comment as-tu retenu cette carte ?</p>
        <div class="srs-actions">
          <button id="btnAgain" class="srs-btn btn-again">
            <span class="srs-emoji">🔴</span>
            <span class="srs-title">À revoir</span>
            <span class="srs-time">&lt; 1 min</span>
          </button>
          <button id="btnHard" class="srs-btn btn-hard">
            <span class="srs-emoji">🟠</span>
            <span class="srs-title">Difficile</span>
            <span class="srs-time">Demain</span>
          </button>
          <button id="btnEasy" class="srs-btn btn-easy">
            <span class="srs-emoji">🟢</span>
            <span class="srs-title">Facile</span>
            <span class="srs-time" id="easyIntervalText">+3 jours</span>
          </button>
        </div>
      </div>

      <footer class="card-footer">
        <button id="prevBtn" class="nav-arrow">← Précédente</button>
        <button id="nextBtn" class="nav-arrow">Suivante →</button>
      </footer>
    </main>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
